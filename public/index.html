<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status</title>
<meta name="description" content="Service status and maintenance information.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%2394a3b8'/></svg>">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2933;
    --muted: #6b7280;
    --line: #e5e7eb;
    --ok: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --fg:#e5e7eb; --muted:#9ca3af; --line:#252a33; --ok:#4ade80; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { width: 100%; max-width: 34rem; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 .35rem; letter-spacing: -.01em; }
  p { margin: 0; color: var(--muted); }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 1.5rem; }
  ul { list-style: none; margin: 1.5rem 0 0; padding: 0; }
  li { display: flex; align-items: center; justify-content: space-between; padding: .7rem 0; border-top: 1px solid var(--line); }
  li span { color: var(--muted); }
  .state { display: inline-flex; align-items: center; gap: .5rem; color: var(--ok); font-variant-numeric: tabular-nums; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  footer { margin-top: 1.25rem; font-size: 13px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>All systems operational</h1>
    <p>No incidents reported. This page refreshes periodically.</p>
    <ul>
      <li>Web<span class="state"><span class="dot"></span>Operational</span></li>
      <li>API<span class="state"><span class="dot"></span>Operational</span></li>
      <li>Storage<span class="state"><span class="dot"></span>Operational</span></li>
      <li>Delivery<span class="state"><span class="dot"></span>Operational</span></li>
    </ul>
  </div>
  <footer>Scheduled maintenance windows are announced in advance.</footer>
</main>
</body>
</html>
